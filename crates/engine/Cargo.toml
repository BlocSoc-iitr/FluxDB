[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
storage.workspace = true
common.workspace = true
db-core.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[[bench]]
name = "btree"
harness = false

[[bench]]
name = "sqlite_compare"
harness = false
