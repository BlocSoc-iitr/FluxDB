name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    paths:
      - '**/*.rs'

jobs:
  claude-review:
    # Skip draft PRs — only review when the PR is genuinely ready
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Cancel any in-progress review for the same PR if a new one is triggered
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            Start by reading CLAUDE.md at the root of this repository. It describes the project architecture (MVCC B+Tree engine, sharded buffer pool, WAL, TransactionManager), crate layout, error-handling conventions, and the Key/Value trait system. Use this as context for every judgement call in the review.

            Then run: /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Provide a detailed review with the following structure. Post a top-level PR comment with the full summary, and inline comments on specific lines where relevant.

            ## Summary
            2-3 sentences: what this PR does and its overall quality.

            ## Correctness & Bugs
            Logic errors, off-by-one issues, race conditions, incorrect MVCC visibility, wrong lock ordering, or anything that would cause wrong runtime behavior. Flag `unsafe` blocks separately.

            ## Code Quality
            Naming clarity, function length, duplication, abstraction level, dead code, and adherence to the codebase conventions in CLAUDE.md (thiserror error enums in common::error, Key/Value trait patterns, etc.).

            ## Performance
            Unnecessary allocations, O(n^2) loops, missing buffer pool hints, blocking calls on hot paths, or anything that conflicts with the sharded buffer pool or WAL sequential-write design.

            ## Security
            Anything that could expose internal state, allow unsafe memory access, or bypass MVCC isolation guarantees.

            ## Suggestions
            Non-blocking improvements the author may want to consider in future PRs.
